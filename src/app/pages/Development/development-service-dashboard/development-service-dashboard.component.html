<div class="d-flex flex-column h-100">
    <app-prime-title-toolbar [pageTitle]="pageTitle"></app-prime-title-toolbar>

    <div class="p-3">
        <div class="row g-3 mb-3">
            <div class="col-12 col-md-4">
                <p-card header="إجمالي الخدمات التنموية">
                    <div class="summary-card" style="--card-color: #42a5f5">
                        <div class="summary-card__count">{{ totalServicesCount }}</div>
                        <div class="summary-card__label">إجمالي الخدمات التنموية</div>
                    </div>
                </p-card>
            </div>
            <div class="col-12 col-md-4">
                <p-card header="إجمالي المستفيدين">
                    <div class="summary-card" style="--card-color: #66bb6a">
                        <div class="summary-card__count">{{ totalBeneficiariesCount }}</div>
                        <div class="summary-card__label">إجمالي المستفيدين</div>
                    </div>
                </p-card>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-12">
                <p-card header="الخدمات التنموية حسب المحافظات">
                    @if (governoratesChartData) {
                        <div style="height: 300px; position: relative">
                            <p-chart type="bar" [data]="governoratesChartData" [options]="chartOptions" height="300" />
                        </div>
                    }
                </p-card>
            </div>
        </div>
    </div>
</div>
