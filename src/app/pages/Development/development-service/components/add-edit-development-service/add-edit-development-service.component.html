@if (form) {
    <form [formGroup]="form" class="row g-4">
        <div class="col-12 col-md-4">
            <app-prime-input-text [formGroup]="form" controlName="name" [label]="'اسم الخدمة'" validatorLanguageType="ar"> </app-prime-input-text>
        </div>

   
        <div class="col-12 col-md-4">
            <label class="text-middle font-14 font-bold mb-2">المركز</label>
            <app-prime-autocomplete [formGroup]="form" controlName="cityId" [getMethod]="getCities.bind(this)" [selectedOption]="selectedCity" [field]="'nameAr'" [language]="language" (onSelect)="onCitySelect($event)" (onClear)="onCitySelect(null)">
            </app-prime-autocomplete>
        </div>
     <div class="col-12 col-md-4">
            <label class="text-middle font-14 font-bold mb-2">قريه/حى</label>
            <app-prime-autocomplete
                [formGroup]="form"
                controlName="townId"
                [getMethod]="getTowns.bind(this)"
                [selectedOption]="selectedTown"
                [field]="'nameAr'"
                [language]="language"
                (onSelect)="onTownSelect($event)"
                (onClear)="onTownSelect(null)"
            >
            </app-prime-autocomplete>
        </div>

        <div class="col-12 col-md-4">
            <label class="text-middle font-14 font-bold mb-2">اسم المبادرة</label>
            <app-prime-autocomplete
                [formGroup]="form"
                controlName="developmentInitiativeId"
                [getMethod]="getDevelopmentInitiatives.bind(this)"
                [selectedOption]="selectedDevelopmentInitiative"
                [field]="'name'"
                [language]="language"
                (onSelect)="onDevelopmentInitiativeSelect($event)"
                (onClear)="onDevelopmentInitiativeSelect(null)"
            >
            </app-prime-autocomplete>
        </div>
<!--               
         <div class="col-12 col-md-4">
            <label class="form-label">نوع الخدمة</label>
            <app-prime-autocomplete
                [formGroup]="form"
                controlName="serviceNameId"
                [getMethod]="getServiceNames.bind(this)"
                [selectedOption]="selectedServiceName"
                [field]="'nameAr'"
                [language]="language"
                (onSelect)="onServiceNameSelect($event)"
                (onClear)="onServiceNameSelect(null)"
            >
            </app-prime-autocomplete>
        </div> -->
 
        <!-- <div class="col-12 col-md-3">
            <label class="form-label">نوع الجهة</label>
            <app-prime-autocomplete
                [formGroup]="form"
                controlName="entityType"
                [getMethod]="getEntities.bind(this)"
                [selectedOption]="selectedEntity"
                [field]="'entityTypeNameAr'"
                [language]="language"
                (onSelect)="onEntitySelect($event)"
                (onClear)="onEntitySelect(null)"
            >
            </app-prime-autocomplete>
        </div> -->
 
 <div class="col-12 col-md-4">
            <app-prime-input-text [formGroup]="form" controlName="beneficiaryMaleNumber"  [label]="'  عدد المستفيدين ذكور'" > </app-prime-input-text>
        </div>

        <div class="col-12 col-md-4">
            <app-prime-input-text [formGroup]="form" controlName="beneficiaryFemaleNumber"  [label]="'  عدد المستفيدين أنثى'" > </app-prime-input-text>
        </div>
        <div class="col-12 col-md-4">
            <app-prime-input-text [formGroup]="form" controlName="totalBeneficiaryNumber" [label]="'عدد المستفيدين'" [readonly]="true"> </app-prime-input-text>
        </div>
     

        <div class="col-12 col-md-4">
            <app-prime-datepicker [formGroup]="form" controlName="serviceStartDate" [mode]="'date'" [label]="'تاريخ بداية الخدمة'"> </app-prime-datepicker>
        </div>

        <div class="col-12 col-md-4">
            <app-prime-datepicker [formGroup]="form" controlName="serviceEndDate" [mode]="'date'" [label]="'تاريخ نهاية الخدمة'" [referenceControlName]="'serviceStartDate'"> </app-prime-datepicker>
        </div>

        <div class="col-12">
            <app-prime-input-text [formGroup]="form" controlName="notes" [label]="'ملاحظات'" inputType="textarea"> </app-prime-input-text>
        </div>

       
      
   <div class="col-12">
                <label class="text-middle font-14 font-bold mb-2">المرفقات</label>

                <div class="mb-2">
                    <input #fileInput type="file" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" class="d-none" (change)="onFileChange($event)" />
                    <button type="button" class="btn btn-outline-primary btn-sm" (click)="fileInput.click()"><i class="pi pi-paperclip me-1"></i> إضافة مرفق</button>
                </div>

                @if (existingAttachments.length > 0) {
                    <div class="mb-2">
                        <small class="text-muted d-block mb-1">الملفات الموجودة</small>
                        @for (attachment of existingAttachments; track attachment.id) {
                            <div class="d-flex align-items-center justify-content-between p-2 border rounded mb-1">
                                <div class="d-flex align-items-center gap-2">
                                    <i [class]="getFileIcon(attachment.fileName)"></i>
                                    <a [href]="getAttachmentUrl(attachment.path)" target="_blank" class="text-decoration-none font-14">{{ attachment.fileName }}</a>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeExistingAttachment(attachment)">
                                    <i class="pi pi-times"></i>
                                </button>
                            </div>
                        }
                    </div>
                }

                @if (selectedFiles.length > 0) {
                    <div>
                        <small class="text-muted d-block mb-1">الملفات المختارة</small>
                        @for (file of selectedFiles; track file.name; let i = $index) {
                            <div class="d-flex align-items-center justify-content-between p-2 border rounded mb-1">
                                <div class="d-flex align-items-center gap-2">
                                    <i [class]="getFileIcon(file.name)"></i>
                                    <span class="font-14">{{ file.name }}</span>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeNewFile(i)">
                                    <i class="pi pi-times"></i>
                                </button>
                            </div>
                        }
                    </div>
                }
            </div>
    

     

        <app-submit-buttons [isSubmitDisabled]="form.invalid" [submitButtonText]="pageType === 'add' ? 'ACTIONS.SUBMIT' : 'ACTIONS.SAVE'" (submit)="submit()" (cancel)="redirect()"> </app-submit-buttons>
    </form>
}
