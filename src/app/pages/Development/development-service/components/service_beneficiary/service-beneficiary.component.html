@if (record) {
    <div class="card">
        <div class="mi-view" dir="rtl">

            <!-- Hero banner -->
            <div class="mi-hero">
                <div class="mi-hero__icon">
                    <i class="pi pi-video"></i>
                </div>
             
            </div>

            <!-- Stats bar -->
            <div class="mi-stats">
                <div class="mi-stat">
                    <i class="pi pi-heart mi-stat__icon" style="color:#e74c3c"></i>
                    <span class="mi-stat__value">{{ record.beneficiaryName || '---' }}</span>
                    <span class="mi-stat__label">اسم المستفيد</span>
                </div>
                
            </div>

            <!-- Details grid -->
          
        </div>
    </div>
} @else {
    <div class="d-flex justify-content-center align-items-center p-5">
        <i class="pi pi-spin pi-spinner" style="font-size: 2rem; color: var(--datatable-header-color)"></i>
    </div>
}
