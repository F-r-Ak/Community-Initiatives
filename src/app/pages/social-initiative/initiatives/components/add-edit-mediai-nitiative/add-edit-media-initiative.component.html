<div class="card">
    @if (form) {
        <form [formGroup]="form" class="row g-4">
            <div class="col-12 ">
                <app-prime-input-text [formGroup]="form" controlName="mediaTitle" [label]="'عنوان الميديا'" validatorLanguageType="ar" [readonly]="isViewMode"> </app-prime-input-text>
            </div>

            <div class="col-12 ">
                <app-prime-input-text [formGroup]="form" controlName="mediaUrl" [label]="'الرابط '" [readonly]="isViewMode"> </app-prime-input-text>
            </div>

           

 <div class="col-12 ">
                <app-prime-input-text [formGroup]="form" controlName="numberOfLikes" [label]="'عدد الإعجابات'"  type="number" [readonly]="isViewMode"> </app-prime-input-text>
            </div>
           
 <div class="col-12 ">
                <app-prime-input-text [formGroup]="form" controlName="numberOfShares" [label]="'عدد المشاركات'" type="number" [readonly]="isViewMode"> </app-prime-input-text>
            </div>
             <div class="col-12 ">
                <app-prime-input-text [formGroup]="form" controlName="numberOfComments" [label]="'عدد التعليقات'" type="number" [readonly]="isViewMode"> </app-prime-input-text>
            </div>
             <div class="col-12 ">
                
                <app-prime-input-text [formGroup]="form" controlName="numberOfViews" [label]="'عدد المشاهدات'" type="number" [readonly]="isViewMode"> </app-prime-input-text>
            </div>

            <div class="col-12">
                <app-prime-input-text [formGroup]="form" controlName="mediaDescription" [label]="'وصف الوسائط'" inputType="textarea" [readonly]="isViewMode"> </app-prime-input-text>
            </div>

            @if(!isViewMode) {
                <app-submit-buttons [isSubmitDisabled]="form.invalid" [submitButtonText]="pageType === 'add' ? 'ACTIONS.SUBMIT' : 'ACTIONS.SAVE'" (submit)="submit()" (cancel)="redirect()"> </app-submit-buttons>
            }
        </form>
    }
</div>
