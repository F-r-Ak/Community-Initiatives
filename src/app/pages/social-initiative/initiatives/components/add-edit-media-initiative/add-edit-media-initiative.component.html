<div class="card">
    @if (form) {
        <form [formGroup]="form" class="row g-4">
            <div class="p-formgrid grid">
                <div class="field col">
                    <app-prime-input-text [formGroup]="form" controlName="mediaTitle" [label]="'عنوان الميديا'" validatorLanguageType="ar"> </app-prime-input-text>
                </div>

                <div class="field col">
                    <app-prime-input-text [formGroup]="form" controlName="mediaUrl" [label]="'الرابط'"> </app-prime-input-text>
                </div>
            </div>

            <div class="field col">
                <app-prime-input-text [formGroup]="form" controlName="mediaDescription" [label]="'وصف الوسائط'" inputType="textarea"> </app-prime-input-text>
            </div>

            <div class="p-formgrid grid">
                <div class="field col">
                    <app-prime-input-text [formGroup]="form" controlName="numberOfLikes" [label]="'عدد الإعجابات'" type="number"> </app-prime-input-text>
                </div>

                <div class="field col">
                    <app-prime-input-text [formGroup]="form" controlName="numberOfShares" [label]="'عدد المشاركات'" type="number"> </app-prime-input-text>
                </div>
                <div class="field col">
                    <app-prime-input-text [formGroup]="form" controlName="numberOfComments" [label]="'عدد التعليقات'" type="number"> </app-prime-input-text>
                </div>
                <div class="field col">
                    <app-prime-input-text [formGroup]="form" controlName="numberOfViews" [label]="'عدد المشاهدات'" type="number"> </app-prime-input-text>
                </div>
            </div>

            <app-submit-buttons [isSubmitDisabled]="form.invalid" [submitButtonText]="pageType === 'add' ? 'ACTIONS.SUBMIT' : 'ACTIONS.SAVE'" (submit)="submit()" (cancel)="redirect()"> </app-submit-buttons>
        </form>
    }
</div>
