<p-dialog
  [(visible)]="deleteMainDialog"
  (onHide)="closeDeleteConfirmationDialog()"
  [breakpoints]="{ '1199px': '90vw', '575px': '92vw' }"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="delete-dialog"
  class="p-fluid">

  <ng-template pTemplate="header">
    <div class="delete-dialog__header">
      <div class="delete-dialog__icon-wrap">
        <i class="pi pi-trash delete-dialog__icon"></i>
      </div>
      <span class="delete-dialog__title">تأكيد الحذف</span>
    </div>
  </ng-template>

  <div class="delete-dialog__body">
    <p class="delete-dialog__message">هل أنت متأكد أنك تريد حذف هذا العنصر؟</p>
    <p class="delete-dialog__hint">لا يمكن التراجع عن هذا الإجراء بعد تنفيذه.</p>
  </div>

  <ng-template pTemplate="footer">
    <div class="delete-dialog__footer">
      <button class="delete-dialog__btn delete-dialog__btn--cancel" (click)="closeDeleteConfirmationDialog()">
        <i class="pi pi-times"></i>
        <span>إلغاء</span>
      </button>
      <button class="delete-dialog__btn delete-dialog__btn--confirm" (click)="confirmDelete()">
        <i class="pi pi-check"></i>
        <span>تأكيد الحذف</span>
      </button>
    </div>
  </ng-template>
</p-dialog>
