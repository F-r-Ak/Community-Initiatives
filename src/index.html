<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <title>المبادرات التنموية والمجتمعية</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.o" />
        <meta name="description" content="نظام المبادرات التنموية والمجتمعية، منصة متكاملة لاستقبال وتتبع ومعالجة مبادرات المواطنين وتربط المواطن بالجهات المختصة بشكل سريع وشفاف، وتضمن متابعة كل مبادرة حتى إتمامها" />
        <meta name="keywords" content="المبادرات التنموية والمجتمعية في أسوان , مبادرات تنموية ومجتمعية, أسوان, اسوان, المبادرات التنموية والمجتمعية, Aswan, Community Initiatives" />
        <meta name="author" content="ISDT" />
        <link rel="preconnect" href="https://primefaces.org" />
        <link rel="icon" type="image/x-icon" href="./assets/img/favicon.png" />
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <!-- Apply language direction before Angular bootstraps to prevent LTR flash on reload -->
        <script>
            (function () {
                var lang = localStorage.getItem('currentLang') || 'ar';
                var html = document.documentElement;
                if (lang === 'ar') {
                    html.setAttribute('lang', 'ar');
                    html.setAttribute('dir', 'rtl');
                    document.body && document.body.setAttribute('dir', 'rtl');
                    document.body && document.body.classList.add('rtl');
                } else {
                    html.setAttribute('lang', 'en');
                    html.setAttribute('dir', 'ltr');
                    document.body && document.body.setAttribute('dir', 'ltr');
                    document.body && document.body.classList.remove('rtl');
                }
            })();
        </script>
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
